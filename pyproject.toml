[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-run"
version = "0.1.0"
description = "Durable continuous execution environment for tool-using language models"
requires-python = ">=3.11"
authors = [{name = "Patrick Sims"}]
license = {text = "Source-available proprietary; see LICENSE"}
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pro-run = "prorun.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
