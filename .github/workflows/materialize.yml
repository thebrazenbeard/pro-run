name: materialize-pro-run-v1

on:
  push:
    branches:
      - build/pro-run-v1-20260925
    paths:
      - ".pro-run-build/**"
      - ".github/workflows/materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/pro-run-v1-20260925
          fetch-depth: 0

      - name: Materialize verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .pro-run-build/part*.b64 > /tmp/pro-run-bundle.b64
          test "$(wc -c < /tmp/pro-run-bundle.b64)" -eq 40656
          base64 -d /tmp/pro-run-bundle.b64 > /tmp/pro-run-bundle.tar.gz
          echo "d9b5435d3d787904d6dff2fa31327202f5cd3ecb0155ed0a47d6477e5193c853  /tmp/pro-run-bundle.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pro-run-bundle.tar.gz
          rm -rf .pro-run-build
          rm -f .github/workflows/materialize.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build Pro-Run V1 durable execution kernel"
          git push origin HEAD:build/pro-run-v1-20260925
